# Local semgrep rules. Rule IDs are the catalog IDs, so each rule is one check
# that passes when it has no findings. Run offline: no registry rules are fetched.
rules:
  - id: SAST-001
    languages: [javascript]
    severity: ERROR
    message: Dynamic code execution (eval / Function constructor).
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
      - pattern: Function(...)

  - id: SAST-002
    languages: [javascript]
    severity: ERROR
    message: Process execution from product code.
    pattern-regex: (require\(|from\s+|import\()\s*["'](node:)?child_process["']

  - id: SAST-003
    languages: [javascript]
    severity: ERROR
    message: HTML injection sink.
    pattern-either:
      - pattern: $E.innerHTML = $V
      - pattern: $E.outerHTML = $V
      - pattern: document.write(...)
      - pattern: $E.insertAdjacentHTML(...)

  - id: SAST-004
    languages: [javascript]
    severity: ERROR
    message: TLS certificate verification disabled.
    pattern-either:
      - pattern: "{..., rejectUnauthorized: false, ...}"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
