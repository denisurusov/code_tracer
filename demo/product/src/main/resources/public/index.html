<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FX Quote</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main>
    <h1>FX Quote</h1>
    <p>Get an indicative price for a currency pair. Amounts are in the base currency.</p>

    <form id="quote-form" novalidate>
      <label for="pair">Currency pair</label>
      <select id="pair" name="pair" required></select>

      <label for="amount">Amount</label>
      <input id="amount" name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" required
             aria-describedby="amount-hint">
      <p id="amount-hint" class="hint">Up to 10,000,000.</p>

      <fieldset>
        <legend>Side</legend>
        <input id="side-buy" type="radio" name="side" value="buy" checked>
        <label for="side-buy" class="inline">Buy</label>
        <input id="side-sell" type="radio" name="side" value="sell">
        <label for="side-sell" class="inline">Sell</label>
      </fieldset>

      <button type="submit">Get quote</button>
    </form>

    <section aria-labelledby="result-heading">
      <h2 id="result-heading">Result</h2>
      <div id="result" role="status" aria-live="polite">No quote yet.</div>
      <div id="error" role="alert"></div>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
