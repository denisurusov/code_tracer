<text x="980" y="118" font-size="12" font-weight="700" fill="#334155">package-version — the spine</text>
<text x="980" y="138" font-size="10.5" font-family="monospace" font-weight="700" fill="#64748b">id = hardened_digest</text>
<text x="980" y="155" font-size="10.5" font-family="monospace" fill="#64748b">purl = …@&lt;upstream&gt;-osera.N · class a|b</text>
<text x="980" y="172" font-size="10.5" font-family="monospace" fill="#64748b">contractRef · chain[L0…L9] · supersedes</text>
<text x="980" y="191" font-size="9.5" font-style="italic" fill="#94a3b8">supersedes and osera.line must agree — a checkable invariant</text>
<text x="980" y="242" font-size="12" font-weight="700" fill="#334155">verdict — immutable, self-contained for replay</text>
<text x="980" y="262" font-size="10.5" font-family="monospace" fill="#64748b">packageRef · inputs{layoutRef, policyRef}</text>
<text x="980" y="280" font-size="10.5" font-family="monospace" font-weight="700" fill="#b91c1c">coreDigest · bundleDigest</text>
<text x="980" y="297" font-size="10.5" font-family="monospace" font-weight="700" fill="#b91c1c">trustRootVersion</text>
<text x="980" y="314" font-size="10.5" font-family="monospace" font-weight="700" fill="#b91c1c">trustPath = osera-root | delegated:&lt;bank&gt;</text>
<text x="980" y="333" font-size="10.5" font-family="monospace" fill="#64748b">decision = admit | reject · failingRule?</text>
<text x="980" y="354" font-size="9.5" font-style="italic" fill="#94a3b8">same coreDigest at two banks, different bundleDigest — the comparison that permits</text>
<text x="980" y="412" font-size="12" font-weight="700" fill="#5b3fa8">ledger-event — append-only, hash-chained</text>
<text x="980" y="432" font-size="10.5" font-family="monospace" fill="#6b5aa5">id = sha256 · prev = prior event for lineKey</text>
<text x="980" y="449" font-size="10.5" font-family="monospace" font-weight="700" fill="#6b5aa5">lineKey = version-less purl + osera.line</text>
<text x="980" y="466" font-size="10.5" font-family="monospace" fill="#6b5aa5">kind = issued|renewed|expired|retired|verifier-revoked</text>
<text x="980" y="483" font-size="10.5" font-family="monospace" fill="#6b5aa5">coveredCves[ ] ← from L-1 scope</text>
<text x="980" y="502" font-size="9.5" font-style="italic" fill="#7c6bb0">break one hash and the whole tail is invalid</text>
<text x="980" y="554" font-size="12" font-weight="700" fill="#5b3fa8">PROJECTIONS — replayed, never authoritative</text>
<text x="980" y="574" font-size="10.5" font-family="monospace" fill="#6b5aa5">state-pointer: lineKey → current id + state</text>
<text x="980" y="591" font-size="10.5" font-family="monospace" fill="#6b5aa5">ledger-row: (appId, lineKey) → window, expiresAt</text>
<text x="980" y="611" font-size="9.5" font-weight="700" fill="#b91c1c">Expiring is COMPUTED (now ≥ expiresAt − window), never stored</text>

