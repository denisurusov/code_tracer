<text x="330" y="726" font-size="10.5" font-weight="700" fill="#b45309">schedule.bridgeExpiry → ledger-row.expiresAt</text>
<text x="330" y="672" font-size="10.5" font-weight="700" fill="#b45309">osera.line → lineKey (declared, never derived)</text>

<rect x="24" y="748" width="1412" height="164" rx="10" fill="#fff5f5" stroke="#f3c7c7"/>
<text x="44" y="772" font-size="12.5" font-weight="700" fill="#b91c1c">WHAT THIS PAGE IS FOR</text>
<text x="44" y="794" font-size="11" fill="#7f1d1d">Every orange arrow is an admission rule in disguise. The gate does not ask "did the provider do good work?" — it asks whether each of these bindings holds:</text>
<text x="44" y="815" font-size="11" fill="#7f1d1d">the baseline they started from IS the one commissioned · the corpus they ran IS the one named by digest · every CVE in scope has a proof that fails on the</text>
<text x="44" y="836" font-size="11" fill="#7f1d1d">baseline and passes on the hardened build · every "fixed" in the VEX points at that proof · and every party that signed the contract re-derived the same digest.</text>
<text x="44" y="864" font-size="11" fill="#7f1d1d">Two grains, one rule: <tspan font-weight="700">the immutable store never references the mutable store.</tspan> Every pointer runs mutable → immutable, so a content hash can never</text>
<text x="44" y="885" font-size="11" fill="#7f1d1d">depend on moving state. The digest is both the join key across the immutable side and the handle the operational side holds.</text>
</svg>
