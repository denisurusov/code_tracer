</g>
<text x="540" y="118" font-size="12" font-weight="700" fill="#334155">L0 baseline</text>
<text x="540" y="137" font-size="10.5" font-family="monospace" fill="#64748b">baseline_digest · source_ref · coordinates</text>
<text x="540" y="151" font-size="9.5" font-style="italic" fill="#94a3b8">re-derivable from the public registry — the anchor</text>
<text x="540" y="198" font-size="12" font-weight="700" fill="#334155">L4 test results</text>
<text x="540" y="217" font-size="10.5" font-family="monospace" fill="#64748b">corpus.digest · results · compat · patchedPathCoverage</text>
<text x="540" y="231" font-size="9.5" font-style="italic" fill="#94a3b8">the tests RUN must be the tests PROMISED</text>
<text x="540" y="278" font-size="12" font-weight="700" fill="#334155">L5 vulnerability proof</text>
<text x="540" y="297" font-size="10.5" font-family="monospace" fill="#64748b">per cve: failsOnBaseline · passesOnHardened</text>
<text x="540" y="311" font-size="9.5" font-style="italic" fill="#94a3b8">one per in-scope CVE, no exceptions</text>
<text x="540" y="358" font-size="12" font-weight="700" fill="#334155">L7 VEX</text>
<text x="540" y="377" font-size="10.5" font-family="monospace" fill="#64748b">per cve: status=fixed · justifiedBy → L5 id</text>
<text x="540" y="391" font-size="9.5" font-style="italic" fill="#94a3b8">no unjustified suppression</text>
<text x="540" y="438" font-size="12" font-weight="700" fill="#0f8a7a">L8 VSA — one per signatory, plus one from the adopting bank</text>
<text x="540" y="457" font-size="10.5" font-family="monospace" fill="#0f6f63">rebuild.digestMatch · l4/l5 recheck · policyPassed</text>
<text x="540" y="473" font-size="10.5" font-family="monospace" font-weight="700" fill="#0f6f63">log.checkpoint · osera.contract.conformance</text>
<text x="540" y="491" font-size="9.5" font-style="italic" fill="#0f8a7a">one per signatory · ZERO dissent · divergent digests or checkpoints disqualify</text>
<text x="540" y="505" font-size="9.5" font-style="italic" fill="#0f8a7a">the bank then rebuilds inside its own perimeter and signs its own</text>
<text x="540" y="521" font-size="9.5" font-weight="700" fill="#b91c1c">L8 is the only link that converts claims into evidence</text>

