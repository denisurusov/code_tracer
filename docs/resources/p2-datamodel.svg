<rect width="1460" height="940" fill="#fbfcfd"/>
<text x="36" y="40" font-size="22" font-weight="700" fill="#1a2332">2 — Data model: which attribute binds to which</text>
<text x="36" y="61" font-size="12.5" fill="#64748b">The contract is the referent every link points back to. Orange = a binding the gate checks; grey = a field carried forward. Assumes page 1.</text>

<rect x="24" y="78" width="440" height="342" rx="10" fill="#fff7ed" stroke="#e6c9a0"/>
<text x="44" y="100" font-size="13" font-weight="700" fill="#a1651a">L-1 CONTRACT — the root referent (frozen at Accepted)</text>
<text x="44" y="124" font-size="11" font-family="monospace" fill="#7c5314">contractId · version</text>
<text x="44" y="143" font-size="11" font-family="monospace" font-weight="700" fill="#7c5314">governance{ mode, sponsor, trustPath, mandateRef,</text>
<text x="44" y="159" font-size="11" font-family="monospace" font-weight="700" fill="#7c5314">            signatories[ ] }</text>
<text x="44" y="178" font-size="11" font-family="monospace" font-weight="700" fill="#7c5314">baseline.digest</text>
<text x="44" y="197" font-size="11" font-family="monospace" font-weight="700" fill="#7c5314">osera.line</text>
<text x="44" y="216" font-size="11" font-family="monospace" font-weight="700" fill="#7c5314">scope.cvesInScope[ ] · each with a pinned record</text>
<text x="44" y="235" font-size="11" font-family="monospace" fill="#7c5314">scope.explicitlyOutOfScope[ ]</text>
<text x="44" y="254" font-size="11" font-family="monospace" font-weight="700" fill="#7c5314">acceptanceCriteria.testCorpus.digest</text>
<text x="44" y="273" font-size="11" font-family="monospace" fill="#7c5314">acceptanceCriteria.thresholds{ coverage, apiAbi }</text>
<text x="44" y="292" font-size="11" font-family="monospace" font-weight="700" fill="#7c5314">verification.k = the signatory set itself</text>
<text x="44" y="311" font-size="11" font-family="monospace" font-weight="700" fill="#7c5314">rebuild{ source, transformation, toolchain } by digest</text>
<text x="44" y="330" font-size="11" font-family="monospace" fill="#7c5314">schedule{ deliverBy, bridgeExpiry }</text>
<text x="44" y="356" font-size="10" font-style="italic" fill="#a1651a">Bold fields are checked by an admission rule. The rest are carried for audit.</text>
<text x="44" y="373" font-size="10" font-style="italic" fill="#a1651a">Identity is the contract digest — the version string is metadata, never identity.</text>
<text x="44" y="398" font-size="10.5" font-weight="700" fill="#b91c1c">A contract that names only one artifact is unverifiable and MUST be rejected.</text>

