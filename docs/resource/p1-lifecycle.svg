<text x="360" y="268" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Lapsed</text>
<text x="360" y="279" font-size="8.5" fill="#7f1d1d" text-anchor="middle">deliverBy passed</text>
<text x="510" y="268" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Breached</text>
<text x="510" y="279" font-size="8.5" fill="#7f1d1d" text-anchor="middle">conformance BREACH</text>
<text x="612" y="266" font-size="9.5" fill="#64748b">amendment = new version +</text>
<text x="612" y="279" font-size="9.5" fill="#64748b">supersession pointer</text>

<!-- ROW 2 — PACKAGE -->
<text x="52" y="336" font-size="12.5" font-weight="700" fill="#334155">PACKAGE — an artifact · identity = hardened_digest</text>
<g filter="url(#s)">
