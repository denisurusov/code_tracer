</g>
<text x="876" y="592" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">Active</text>
<text x="876" y="609" font-size="9.5" fill="#64748b" text-anchor="middle">inside the bridge window</text>
<text x="876" y="622" font-size="9.5" fill="#64748b" text-anchor="middle">tracked by ⑤</text>
<text x="1056" y="592" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">Sunset</text>
<text x="1056" y="609" font-size="9.5" fill="#64748b" text-anchor="middle">bridge lapsed</text>
<text x="1056" y="622" font-size="9" font-style="italic" fill="#94a3b8" text-anchor="middle">Expiring is computed</text>
<text x="1236" y="592" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Retired</text>
<text x="1236" y="609" font-size="9.5" fill="#64748b" text-anchor="middle">upstream fix adopted</text>
<text x="1236" y="622" font-size="9.5" fill="#64748b" text-anchor="middle">terminal</text>
