<rect x="1166" y="350" width="140" height="60" rx="7" fill="#fff" stroke="#c7bced"/>
</g>
<text x="402" y="374" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">Built</text>
<text x="402" y="391" font-size="9.5" fill="#64748b" text-anchor="middle">provider mints L0–L7</text>
<text x="582" y="374" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">Verified</text>
<text x="582" y="391" font-size="9.5" fill="#64748b" text-anchor="middle">quorum rebuilds → L8</text>
<text x="582" y="404" font-size="9" font-weight="700" fill="#b91c1c" text-anchor="middle">zero dissent</text>
<text x="876" y="374" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">Resolved</text>
<text x="876" y="391" font-size="9.5" fill="#64748b" text-anchor="middle">bundle sealed by ③</text>
<text x="1056" y="374" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">Gate</text>
<text x="1056" y="390" font-size="9.5" fill="#64748b" text-anchor="middle">structural → semantic → L9</text>
<text x="1056" y="403" font-size="9.5" fill="#64748b" text-anchor="middle">16 rules · ①②④</text>
<text x="1236" y="374" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">Adopted</text>
<text x="1236" y="391" font-size="9.5" fill="#64748b" text-anchor="middle">golden repo · L9</text>
<text x="1236" y="404" font-size="9" font-style="italic" fill="#94a3b8" text-anchor="middle">last package state</text>
