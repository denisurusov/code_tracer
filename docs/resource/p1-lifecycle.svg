<text x="114" y="209" font-size="9.5" fill="#64748b" text-anchor="middle">mutable · unsigned</text>
<text x="254" y="192" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">Proposed</text>
<text x="254" y="209" font-size="9.5" fill="#64748b" text-anchor="middle">issuer signs</text>
<text x="394" y="190" font-size="12.5" font-weight="700" fill="#c2691a" text-anchor="middle">Accepted</text>
<text x="394" y="204" font-size="9" font-weight="700" fill="#c2691a" text-anchor="middle">THE FREEZE</text>
<text x="394" y="216" font-size="9" fill="#c2691a" text-anchor="middle">provider countersigns</text>
<text x="534" y="192" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">Delivered</text>
<text x="534" y="209" font-size="9.5" fill="#64748b" text-anchor="middle">manifest logged</text>
<text x="674" y="192" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">Fulfilled</text>
<text x="674" y="209" font-size="9.5" fill="#64748b" text-anchor="middle">k-of-n VSAs · FULL</text>
