<rect width="1440" height="900" fill="#fbfcfd"/>

<text x="36" y="40" font-size="22" font-weight="700" fill="#1a2332">1 — Lifecycle &amp; zones</text>
<text x="36" y="62" font-size="12.5" fill="#64748b">Three machines, three grains, one boundary. A project is a commitment; a package is an artifact; a product is a bridge. Read this page first.</text>

<rect x="24" y="86" width="734" height="744" rx="10" fill="#fef6ec" stroke="#f3ddc0"/>
<text x="52" y="110" font-size="12.5" font-weight="700" fill="#a1651a">OUTSIDE — issuer · provider · verifier quorum</text>
<text x="52" y="127" font-size="10.5" fill="#a1651a">evidence is PRODUCED here</text>

<rect x="782" y="86" width="634" height="744" rx="10" fill="#f2f0fb" stroke="#ddd6f3"/>
<text x="806" y="110" font-size="12.5" font-weight="700" fill="#5b3fa8">INSIDE THE BANK</text>
<text x="806" y="127" font-size="10.5" fill="#5b3fa8">evidence is CONSUMED here — hermetic and offline</text>

<line x1="770" y1="86" x2="770" y2="830" stroke="#1a2332" stroke-width="3" stroke-dasharray="9 5"/>
<text x="770" y="852" font-size="11.5" font-weight="700" fill="#1a2332" text-anchor="middle">THE PERIMETER</text>
<text x="770" y="868" font-size="10.5" fill="#64748b" text-anchor="middle">one evidence bundle crosses — a copy, not a protocol</text>

<!-- ROW 1 — PROJECT -->
<text x="52" y="156" font-size="12.5" font-weight="700" fill="#334155">PROJECT — a commitment · identity = contract digest</text>
<g filter="url(#s)">
