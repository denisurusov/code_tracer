<line x1="1126" y1="598" x2="1164" y2="598"/>
</g>

<!-- renewal loop -->
<g stroke="#c2691a" stroke-width="2" fill="none" stroke-dasharray="7 4" marker-end="url(#ao)"><path d="M1056 628 L1056 800 L38 800 L38 196 L50 196"/></g>
<text x="1040" y="662" font-size="11.5" font-weight="700" fill="#c2691a" text-anchor="end">RENEWAL — a new project against the same line</text>
<text x="1040" y="677" font-size="9.5" fill="#a1651a" text-anchor="end">its own contract, its own baseline, its own CVE set · same lineKey</text>
<text x="1040" y="691" font-size="9.5" fill="#a1651a" text-anchor="end">osera.1 → osera.2 linked by a supersedes edge on the package</text>
<text x="1040" y="705" font-size="9.5" fill="#a1651a" text-anchor="end">a renewal that jumps lines is a NEW lineage, not a supersede</text>

<!-- invariant panel -->
<rect x="100" y="700" width="600" height="108" rx="8" fill="#fff7ed" stroke="#e6c9a0"/>
<text x="120" y="722" font-size="11.5" font-weight="700" fill="#a1651a">THE INVARIANT THIS PAGE EXISTS TO SHOW</text>
<text x="120" y="742" font-size="10.5" fill="#7c5314">Each state belongs to exactly one grain. Facts about a build attach to a digest;</text>
<text x="120" y="757" font-size="10.5" fill="#7c5314">facts about exposure attach to a lineage that outlives every digest in it.</text>
<text x="120" y="777" font-size="10.5" fill="#7c5314">Class (a) and (b) diverge only at Built and Verified — from Resolved inward the</text>
<text x="120" y="792" font-size="10.5" fill="#7c5314">machine is class-agnostic, which is what lets the gate be one tool instead of two.</text>
</svg>
