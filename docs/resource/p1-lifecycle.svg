<text x="728" y="368" font-size="10.5" font-weight="700" fill="#1a2332" text-anchor="middle">evidence bundle</text>

<!-- hinge -->
<g stroke="#c2691a" stroke-width="2.2" fill="none" marker-end="url(#ao)"><path d="M420 224 L420 348"/></g>
<text x="432" y="290" font-size="11" font-weight="700" fill="#c2691a">THE HINGE</text>
<text x="432" y="304" font-size="9.5" fill="#a1651a">Accepted starts the package work</text>
<text x="432" y="317" font-size="9.5" fill="#a1651a">everything from here is signed and immutable</text>

<!-- rejected -->
<g stroke="#b91c1c" stroke-width="1.6" fill="none" marker-end="url(#ar)"><line x1="1010" y1="410" x2="1010" y2="446"/></g>
<rect x="940" y="448" width="140" height="40" rx="6" fill="#fff5f5" stroke="#f3c7c7"/>
<text x="1010" y="464" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Rejected</text>
<text x="1010" y="478" font-size="8.5" fill="#7f1d1d" text-anchor="middle">failing rule recorded</text>
<text x="1092" y="462" font-size="9.5" fill="#64748b">a corrected re-submission is a</text>
<text x="1092" y="475" font-size="9.5" fill="#64748b">NEW package under a NEW project</text>

<!-- handover elbow -->
<g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M1236 410 L1236 512 L876 512 L876 566"/></g>
<text x="1056" y="504" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">THE HANDOVER — L9 minted over the digest; the exposure opens against the lineage</text>

<!-- ROW 3 — PRODUCT -->
<text x="806" y="552" font-size="12.5" font-weight="700" fill="#334155">PRODUCT — a bridge · identity = lineKey</text>
<g filter="url(#s)">
