<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 880" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f4e"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2691a"/></marker>
<filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#1a2332" flood-opacity="0.13"/></filter>
</defs>
<rect width="1420" height="880" fill="#fbfcfd"/>
<text x="36" y="40" font-size="22" font-weight="700" fill="#1a2332">1 — Lifecycle &amp; zones</text>
<text x="36" y="61" font-size="12.5" fill="#64748b">Two state machines, one boundary. The contract tracks a commitment; the candidate tracks an artifact. Read this page first.</text>

<!-- zone columns -->
<rect x="24" y="82" width="700" height="700" rx="10" fill="#fef6ec" stroke="#f3ddc0"/>
<text x="44" y="104" font-size="12.5" font-weight="700" fill="#a1651a">OUTSIDE — issuer · maker · verifier quorum</text>
<text x="44" y="122" font-size="10.5" fill="#a1651a">evidence is PRODUCED here · code_tracer's issuer half runs here</text>
<rect x="736" y="82" width="660" height="700" rx="10" fill="#f2f0fb" stroke="#ddd6f3"/>
<text x="756" y="104" font-size="12.5" font-weight="700" fill="#5b3fa8">INSIDE THE BANK</text>
<text x="756" y="122" font-size="10.5" fill="#5b3fa8">evidence is CONSUMED here · hermetic and offline from the moment the bundle is sealed</text>

<!-- perimeter -->
<line x1="730" y1="82" x2="730" y2="782" stroke="#1a2332" stroke-width="3" stroke-dasharray="9 5"/>
<text x="730" y="800" font-size="11.5" font-weight="700" fill="#1a2332" text-anchor="middle">THE PERIMETER</text>
<text x="730" y="816" font-size="10.5" fill="#64748b" text-anchor="middle">one evidence bundle crosses — a copy, not a protocol</text>

<!-- public upstream strip -->
<rect x="44" y="136" width="660" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="60" y="155" font-size="11.5" font-weight="700" fill="#475569">PUBLIC UPSTREAM — the anchor, controlled by nobody here</text>
<text x="60" y="172" font-size="10" fill="#64748b">package registry (per purl type) · upstream git · OSV/NVD — read at commissioning and again at admission</text>

<!-- CONTRACT LIFECYCLE -->
<text x="44" y="212" font-size="13" font-weight="700" fill="#334155">CONTRACT LIFECYCLE — a commitment</text>
<g filter="url(#s)">
<rect x="44" y="224" width="118" height="52" rx="7" fill="#fff" stroke="#e6c9a0"/>
<rect x="186" y="224" width="118" height="52" rx="7" fill="#fff" stroke="#e6c9a0"/>
<rect x="328" y="224" width="118" height="52" rx="7" fill="#fff" stroke="#c2691a" stroke-width="2"/>
<rect x="470" y="224" width="118" height="52" rx="7" fill="#fff" stroke="#e6c9a0"/>
<rect x="596" y="224" width="112" height="52" rx="7" fill="#fff" stroke="#e6c9a0"/>
</g>
<text x="103" y="246" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Drafted</text>
<text x="103" y="263" font-size="9.5" fill="#64748b" text-anchor="middle">mutable draft</text>
<text x="245" y="246" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Proposed</text>
<text x="245" y="263" font-size="9.5" fill="#64748b" text-anchor="middle">issuer signs</text>
<text x="387" y="243" font-size="12" font-weight="700" fill="#c2691a" text-anchor="middle">Accepted</text>
<text x="387" y="257" font-size="9" font-weight="700" fill="#c2691a" text-anchor="middle">FREEZE</text>
<text x="387" y="269" font-size="9" fill="#c2691a" text-anchor="middle">maker countersigns</text>
<text x="529" y="246" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Delivered</text>
<text x="529" y="263" font-size="9.5" fill="#64748b" text-anchor="middle">manifest logged</text>
<text x="652" y="246" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Fulfilled</text>
<text x="652" y="263" font-size="9.5" fill="#64748b" text-anchor="middle">k-of-n VSAs</text>
<g stroke="#475569" stroke-width="1.4" fill="none" marker-end="url(#a)">
<line x1="162" y1="250" x2="184" y2="250"/><line x1="304" y1="250" x2="326" y2="250"/>
<line x1="446" y1="250" x2="468" y2="250"/><line x1="588" y1="250" x2="594" y2="250"/>
</g>
<text x="44" y="303" font-size="9.5" fill="#b91c1c">terminals: <tspan font-weight="700">Withdrawn</tspan> (retracted pre-acceptance) · <tspan font-weight="700">Breached</tspan> (conformance BREACH) · <tspan font-weight="700">Lapsed</tspan> (deliverBy passed, nothing delivered)</text>
<text x="44" y="319" font-size="9.5" fill="#64748b">amendment = new version + supersession pointer, fresh countersignature — the ONLY route by which a shortfall reaches admission</text>

<!-- emit arrow — elbows right of the terminals/amendment text and lands on Commissioned -->
<g stroke="#c2691a" stroke-width="2" fill="none" marker-end="url(#ao)"><path d="M387 278 L387 288 L700 288 L700 372 L545 372 L545 415"/></g>
<text x="470" y="365" font-size="10.5" font-weight="700" fill="#c2691a">Accepted emits Commissioned</text>

<!-- CANDIDATE LIFECYCLE -->
<text x="44" y="380" font-size="13" font-weight="700" fill="#334155">CANDIDATE LIFECYCLE — an artifact</text>
<rect x="44" y="392" width="404" height="118" rx="8" fill="#fff7ed" stroke="#e6c9a0" stroke-dasharray="4 3"/>
<text x="246" y="410" font-size="10" font-weight="700" fill="#a1651a" text-anchor="middle">the ONLY band where ingest class (a) / (b) differ</text>
<g filter="url(#s)">
<rect x="60" y="420" width="170" height="74" rx="7" fill="#fff" stroke="#e6c9a0"/>
<rect x="262" y="420" width="170" height="74" rx="7" fill="#fff" stroke="#e6c9a0"/>
</g>
<text x="145" y="443" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Built</text>
<text x="145" y="461" font-size="9.5" fill="#64748b" text-anchor="middle">maker mints L0–L7</text>
<text x="145" y="478" font-size="9.5" fill="#64748b" text-anchor="middle">(b): project health instead</text>
<text x="347" y="443" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Verified</text>
<text x="347" y="461" font-size="9.5" fill="#64748b" text-anchor="middle">k-of-n rebuild → L8</text>
<text x="347" y="478" font-size="9.5" font-weight="700" fill="#b91c1c" text-anchor="middle">zero dissent</text>
<g filter="url(#s)"><rect x="470" y="420" width="150" height="74" rx="7" fill="#fff" stroke="#e6c9a0"/></g>
<text x="545" y="443" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Commissioned</text>
<text x="545" y="461" font-size="9.5" fill="#64748b" text-anchor="middle">L-1 accepted;</text>
<text x="545" y="478" font-size="9.5" fill="#64748b" text-anchor="middle">scope + corpus frozen</text>
<g stroke="#475569" stroke-width="1.4" fill="none" marker-end="url(#a)">
<line x1="470" y1="457" x2="436" y2="457"/><line x1="262" y1="457" x2="234" y2="457"/>
</g>

<!-- inside states -->
<g filter="url(#s)">
<rect x="756" y="392" width="140" height="66" rx="7" fill="#fff" stroke="#c7bced"/>
<rect x="930" y="392" width="140" height="66" rx="7" fill="#fff" stroke="#e11d48" stroke-width="2"/>
<rect x="1104" y="392" width="140" height="66" rx="7" fill="#fff" stroke="#c7bced"/>
<rect x="1104" y="490" width="140" height="66" rx="7" fill="#fff" stroke="#c7bced"/>
<rect x="930" y="490" width="140" height="66" rx="7" fill="#fff" stroke="#c7bced"/>
<rect x="756" y="490" width="140" height="66" rx="7" fill="#fff" stroke="#cbd5e1"/>
</g>
<text x="826" y="418" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Resolved</text>
<text x="826" y="436" font-size="9.5" fill="#64748b" text-anchor="middle">bundle assembled</text>
<text x="826" y="450" font-size="9.5" fill="#64748b" text-anchor="middle">by ③</text>
<text x="1000" y="418" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Gate</text>
<text x="1000" y="436" font-size="9.5" fill="#64748b" text-anchor="middle">structural → semantic</text>
<text x="1000" y="450" font-size="9.5" fill="#64748b" text-anchor="middle">→ L9 · 15 rules</text>
<text x="1174" y="418" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Adopted</text>
<text x="1174" y="436" font-size="9.5" fill="#64748b" text-anchor="middle">promoted to</text>
<text x="1174" y="450" font-size="9.5" fill="#64748b" text-anchor="middle">golden repo</text>
<text x="1174" y="516" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Active</text>
<text x="1174" y="534" font-size="9.5" fill="#64748b" text-anchor="middle">in production;</text>
<text x="1174" y="548" font-size="9.5" fill="#64748b" text-anchor="middle">inside the bridge window</text>
<text x="1000" y="516" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Sunset</text>
<text x="1000" y="534" font-size="9.5" fill="#64748b" text-anchor="middle">bridge lapsed</text>
<text x="1000" y="548" font-size="9.5" font-style="italic" fill="#64748b" text-anchor="middle">Expiring is computed, not stored</text>
<text x="826" y="516" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">Retired</text>
<text x="826" y="534" font-size="9.5" fill="#64748b" text-anchor="middle">upstream fix adopted</text>
<text x="826" y="548" font-size="9.5" fill="#64748b" text-anchor="middle">terminal</text>

<g stroke="#475569" stroke-width="1.4" fill="none" marker-end="url(#a)">
<line x1="896" y1="425" x2="928" y2="425"/>
<line x1="1070" y1="425" x2="1102" y2="425"/>
<line x1="1174" y1="458" x2="1174" y2="488"/>
<line x1="1104" y1="523" x2="1072" y2="523"/>
<line x1="930" y1="523" x2="898" y2="523"/>
</g>
<g stroke="#2f8f4e" stroke-width="1.8" fill="none" marker-end="url(#ag)"><line x1="1000" y1="458" x2="1080" y2="400"/></g>
<text x="1012" y="474" font-size="9.5" font-weight="700" fill="#2f8f4e">admit</text>
<g stroke="#b91c1c" stroke-width="1.6" fill="none" marker-end="url(#ar)"><line x1="962" y1="458" x2="962" y2="590"/></g>
<text x="988" y="606" font-size="11" font-weight="700" fill="#b91c1c">Rejected — terminal, failing rule recorded</text>
<text x="988" y="622" font-size="9.5" fill="#64748b">a corrected re-submission is a NEW candidate, never a reopening</text>

<!-- bundle crossing -->
<g stroke="#1a2332" stroke-width="2.2" fill="none" marker-end="url(#a)"><line x1="620" y1="440" x2="752" y2="420"/></g>
<text x="640" y="410" font-size="10.5" font-weight="700" fill="#1a2332">evidence bundle</text>

<!-- renewal loop -->
<g stroke="#c2691a" stroke-width="2" fill="none" marker-end="url(#a)" stroke-dasharray="6 4">
<path d="M960 556 C 900 650, 620 650, 545 502"/>
</g>
<text x="374" y="694" font-size="11.5" font-weight="700" fill="#c2691a" text-anchor="middle">RENEWAL — a new candidate that supersedes the old one, never a status flip</text>
<text x="374" y="712" font-size="10" fill="#a1651a" text-anchor="middle">its own L-1 contract, its own baseline, its own CVE set · same candidateKey · osera.1 → osera.2 linked by a supersedes edge</text>
<text x="374" y="728" font-size="10" fill="#a1651a" text-anchor="middle">this is what lets the bank answer "what exactly were we running in March, and what did it cover?"</text>

<rect x="756" y="640" width="640" height="126" rx="8" fill="#faf9ff" stroke="#ddd6f3"/>
<text x="774" y="662" font-size="11.5" font-weight="700" fill="#5b3fa8">THE INVARIANT THIS PAGE EXISTS TO SHOW</text>
<text x="774" y="683" font-size="10.5" fill="#4c3a80">Class (a) and (b) diverge only in Built/Verified. From Resolved inward the machine is</text>
<text x="774" y="699" font-size="10.5" fill="#4c3a80">class-agnostic — which is what lets the gate be one parameterized tool instead of two.</text>
<text x="774" y="722" font-size="10.5" fill="#4c3a80">Everything left of the perimeter is someone else's infrastructure. Everything right of it</text>
<text x="774" y="738" font-size="10.5" fill="#4c3a80">is ours, offline, and replayable by a regulator from stored inputs alone.</text>
<text x="774" y="757" font-size="10" font-style="italic" fill="#7c6bb0">Records behind each state: page 2. Components that act on them: page 3.</text>
</svg>
