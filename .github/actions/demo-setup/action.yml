name: demo setup
description: Toolchain for the test-evidence demo (Node, optional Java, cosign, optional scanners and OPA).

inputs:
  java:
    description: Install Java 21 (Temurin) and Maven caching
    default: "false"
  scanners:
    description: Install gitleaks, semgrep and opa
    default: "false"
  maven-server:
    description: Write a Maven settings server "github" for GitHub Packages
    default: "false"

runs:
  using: composite
  steps:
    - if: inputs.java == 'true'
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 21
        cache: maven
        cache-dependency-path: demo/product/pom.xml
        server-id: ${{ inputs.maven-server == 'true' && 'github' || '' }}
        server-username: ${{ inputs.maven-server == 'true' && 'GITHUB_ACTOR' || '' }}
        server-password: ${{ inputs.maven-server == 'true' && 'GITHUB_TOKEN' || '' }}

    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: demo/package-lock.json

    - name: Install Node dependencies
      shell: bash
      working-directory: demo
      run: npm ci --no-audit --no-fund

    - name: Install cosign
      shell: bash
      run: |
        sudo curl -sSL -o /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64
        sudo chmod +x /usr/local/bin/cosign
        cosign version | grep GitVersion

    - if: inputs.scanners == 'true'
      name: Install gitleaks, semgrep, opa
      shell: bash
      run: |
        curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
          | sudo tar xz -C /usr/local/bin gitleaks
        pipx install semgrep==1.185.0
        sudo curl -sSL -o /usr/local/bin/opa https://github.com/open-policy-agent/opa/releases/download/v1.4.2/opa_linux_amd64_static
        sudo chmod +x /usr/local/bin/opa
        gitleaks version && semgrep --version && opa version | head -1
