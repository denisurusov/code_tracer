name: demo test evidence

# Runs the demo end to end: a reproducible Maven build of the Java product with
# signed SLSA provenance, every test category against the built jar, conversion
# to CTRF/SARIF/OSV (against a freshly downloaded, digest-pinned OSV Maven
# snapshot), signed in-toto test-result attestations bundled as .intoto.jsonl,
# named sign-offs, the gate (structural checks, a rebuild of the jar, and the
# Rego policy), and the gate's negative cases. Evidence is uploaded as a run
# artifact.
#
# Signing uses throwaway Ed25519 keys generated in the job, so the run shows the
# mechanics; trust does not carry across runs. The optional github-attest job
# additionally publishes each predicate through GitHub artifact attestations
# (Sigstore keyless, identity = this workflow). That needs a public repository or
# GitHub Enterprise Cloud, so it is off by default.

on:
  workflow_dispatch:
    inputs:
      github-attest:
        description: "Also publish predicates with actions/attest (public repo or GHEC only)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      github-attest:
        type: boolean
        default: false
  pull_request:
    paths: ["demo/**", ".github/workflows/demo-test-evidence.yml"]

permissions:
  contents: read

concurrency:
  group: demo-test-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    outputs:
      jar-digest: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: demo/product/pom.xml

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install scanners and policy engine (gitleaks, semgrep, opa)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | sudo tar xz -C /usr/local/bin gitleaks
          pipx install semgrep==1.185.0
          sudo curl -sSL -o /usr/local/bin/opa https://github.com/open-policy-agent/opa/releases/download/v1.4.2/opa_linux_amd64_static
          sudo chmod +x /usr/local/bin/opa
          gitleaks version && semgrep --version && opa version | head -1

      - name: Build the jar and sign SLSA provenance
        run: npm run build

      # Playwright (JS and Java) uses the Google Chrome preinstalled on ubuntu-latest (channel "chrome").
      - name: Run all test categories against the jar and sign the evidence
        run: npm run evidence

      - name: Named sign-offs (demo reviewers)
        run: npm run signoffs

      - name: Gate policy tests (Rego)
        run: npm run policy:test

      - name: Gate
        run: npm run gate

      - name: Gate negative cases
        run: npm run gate:negative

      - id: digest
        name: Jar digest
        run: echo "sha256=$(sha256sum out/artifacts/fx-quote-demo-0.1.0.jar | cut -c1-64)" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Test evidence"
            echo
            echo "| category | result | passed | warned | failed |"
            echo "|---|---|---|---|---|"
            for f in out/attestations/*.dsse.json; do
              node -e '
                const e = JSON.parse(require("fs").readFileSync(process.argv[1]));
                const s = JSON.parse(Buffer.from(e.payload, "base64"));
                const p = s.predicate;
                if (s.predicateType === "https://slsa.dev/provenance/v1") console.log(`| build (SLSA provenance) | ${s.subject[0].digest.sha256.slice(0, 12)}… | | | |`);
                else console.log(`| ${p["x-code-tracer"].category} | ${p.result} | ${p.passedTests.length} | ${p.warnedTests.length} | ${p.failedTests.length} |`);
              ' "$f"
            done
            echo
            node -e 'const r = require("./out/gate-report.json"); console.log(`**Gate verdict:** ${r.verdict}`)'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            demo/out/evidence.intoto.jsonl
            demo/out/artifacts
            demo/out/attestations
            demo/out/results
            demo/out/vsa.dsse.json
            demo/out/gate-report.json
            demo/.keys/trust.json
          if-no-files-found: error

  github-attest:
    needs: evidence
    if: ${{ inputs.github-attest }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
      artifact-metadata: write
    strategy:
      matrix:
        category: [unit, integration, contract, e2e, uat, accessibility, load, sast, secrets, sca, license, data-quality]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: test-evidence
          path: evidence
      - name: Extract predicate
        run: |
          node -e '
            const e = JSON.parse(require("fs").readFileSync(process.argv[1]));
            require("fs").writeFileSync("predicate.json", JSON.stringify(JSON.parse(Buffer.from(e.payload, "base64")).predicate));
          ' "evidence/out/attestations/${{ matrix.category }}.dsse.json"
      - uses: actions/attest@v2
        with:
          subject-name: pkg:maven/demo.codetracer/fx-quote-demo@0.1.0?type=jar
          subject-digest: sha256:${{ needs.evidence.outputs.jar-digest }}
          predicate-type: https://in-toto.io/attestation/test-result/v0.1
          predicate-path: predicate.json
